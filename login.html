<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>
    <link rel="stylesheet" href="login_style.css">
</head>

<body>
    

    <div class="form-container">
        <h2 id="formTitle">Login</h2>
        <form id="authForm">
            <label for="username">Username</label>
            <input type="text" id="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <div class="show-password" id="showPasswordContainer">
                <input type="checkbox" id="showPassword" onclick="togglePasswordVisibility()">
                <label for="showPassword">Show Password</label>
            </div>

            <label for="confirmPassword" id="confirmPasswordLabel" style="display: none;">Confirm Password</label>
            <input type="password" id="confirmPassword" style="display: none;">

            <p id="passwordMatchMessage" style="font-size: 14px; display: none;"></p>

            <button type="button" onclick="handleSubmit()">Login</button>
            <p id="errorMessage"></p>

            <p id="toggleText">Don't have an account? <a href="#" onclick="toggleForm()">Sign Up</a></p>
        </form>
    </div>

    <!-- CUSTOM MODAL (matches dark blue design) -->
    <div id="customModal" class="modal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <button onclick="closeModal()">OK</button>
        </div>
    </div>
    

    <script>
        let isLogin = true;

        function toggleForm() {
            const formTitle = document.getElementById('formTitle');
            const confirmPassword = document.getElementById('confirmPassword');
            const confirmPasswordLabel = document.getElementById('confirmPasswordLabel');
            const submitButton = document.querySelector('button');
            const toggleText = document.getElementById('toggleText');
            const showPasswordContainer = document.getElementById('showPasswordContainer');

            document.getElementById('authForm').reset();
            document.getElementById('errorMessage').textContent = '';

            if (isLogin) {
                formTitle.textContent = 'Sign Up';
                confirmPassword.style.display = 'block';
                confirmPasswordLabel.style.display = 'block';
                submitButton.textContent = 'Sign Up';
                toggleText.innerHTML = 'Already have an account? <a href="#" onclick="toggleForm()">Login</a>';
                showPasswordContainer.style.visibility = 'hidden';
                isLogin = false;
            } else {
                formTitle.textContent = 'Login';
                confirmPassword.style.display = 'none';
                confirmPasswordLabel.style.display = 'none';
                submitButton.textContent = 'Login';
                toggleText.innerHTML = 'Don\'t have an account? <a href="#" onclick="toggleForm()">Sign Up</a>';
                showPasswordContainer.style.visibility = 'visible';
                isLogin = true;
            }
        }

        function handleSubmit() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            if (isLogin) {
                const storedUsername = localStorage.getItem('username');
                const storedPassword = localStorage.getItem('password');

                if (username == storedUsername && password === storedPassword) {
                    showModal('Welcome! Successfully logged in.');
                    // Redirect after clicking OK
                    window.modalRedirect = 'index.html';
                } else {
                    errorMessage.textContent = 'Invalid username or password';
                }
            } else {
                const confirmPassword = document.getElementById('confirmPassword').value;
                if (password !== confirmPassword) {
                    errorMessage.textContent = 'Passwords do not match';
                } else if (username && password) {
                    localStorage.setItem('username', username);
                    localStorage.setItem('password', password);
                    showModal('Account created successfully! You can now log in.');
                    document.getElementById('authForm').reset();
                    toggleForm();
                } else {
                    errorMessage.textContent = 'Please fill out all fields';
                }
            }
        }

        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            passwordField.type = passwordField.type === 'password' ? 'text' : 'password';
        }

        // ===== CUSTOM MODAL FUNCTIONS =====
        function showModal(message) {
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('customModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
            if (window.modalRedirect) {
                window.location.href = window.modalRedirect;
                window.modalRedirect = null;
            }
        }

        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            const message = document.getElementById('passwordMatchMessage');

            if (confirmPassword === "") {
                message.style.display = 'none';
            } else if (confirmPassword === password) {
                message.textContent = 'Passwords match';
                message.style.color = '#4ade80';
                message.style.display = 'block';
            } else {
                message.textContent = 'Passwords do not match';
                message.style.color = '#f87171';
                message.style.display = 'block';
            }
        });
    </script>
    <!-- Custom Logout Modal -->
<div id="logoutModal" class="modal">
    <div class="modal-card">
        <p>Are you sure you want to log out?</p>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeLogoutModal()">Cancel</button>
            <button class="btn-confirm" onclick="doLogout()">OK</button>
        </div>
    </div>
</div>
</body>
</html>
